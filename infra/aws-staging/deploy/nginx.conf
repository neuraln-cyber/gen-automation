worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout combined;
    server_tokens off;

    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;

    map $http_x_forwarded_for $guard_client {
        ""      $remote_addr;
        default $http_x_forwarded_for;
    }

    limit_req_zone $guard_client zone=all_requests_per_client:10m rate=5r/s;
    limit_req_zone $guard_client zone=authentication_per_client:10m rate=10r/m;
    limit_conn_zone $guard_client zone=connections_per_client:10m;

    upstream control_plane {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen 127.0.0.1:8080;

        client_max_body_size 8m;
        client_body_timeout 30s;
        client_header_timeout 10s;
        client_header_buffer_size 1k;
        large_client_header_buffers 4 8k;
        keepalive_timeout 120s;
        send_timeout 60s;

        limit_req zone=all_requests_per_client burst=50 nodelay;
        limit_conn connections_per_client 20;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $guard_client;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $guard_client;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;

        location = /login {
            limit_req zone=all_requests_per_client burst=50 nodelay;
            limit_req zone=authentication_per_client burst=5 nodelay;
            proxy_pass http://control_plane;
        }

        location ^~ /api/v1/auth/ {
            limit_req zone=all_requests_per_client burst=50 nodelay;
            limit_req zone=authentication_per_client burst=5 nodelay;
            proxy_pass http://control_plane;
        }

        location / {
            proxy_pass http://control_plane;
        }
    }
}
