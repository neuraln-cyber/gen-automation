name: Deploy staging control plane

on:
  workflow_run:
    workflows: ["Publish immutable images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      component:
        description: Select the bounded staging operation
        required: true
        type: choice
        default: semantic-anatomy
        options:
          - semantic-anatomy
          - lora-manager
          - i2v-lora-worker
          - i2v-lora-profile
      operation:
        description: Status, dry-run, promote, pause, enable, or disable
        required: true
        type: choice
        default: dry-run
        options:
          - status
          - dry-run
          - promote
          - rollback
          - pause
          - enable
          - disable
      max_assessments:
        description: Monotonic per-scoring-run assessment cap (1-1000)
        required: true
        type: string
        default: "400"
      i2v_worker_image:
        description: Exact ghcr.io/.../i2v-worker@sha256 digest for an I2V LoRA operation
        required: false
        type: string
        default: ""
      i2v_worker_source_revision:
        description: Exact 40-hex source revision embedded in the I2V worker
        required: false
        type: string
        default: ""
permissions:
  actions: read
  contents: read
  packages: read
  id-token: write

concurrency:
  group: deploy-staging-control-plane
  cancel-in-progress: false

jobs:
  deploy:
    name: Roll out immutable control plane
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AWS_REGION: eu-central-1
      AWS_STAGING_INSTANCE_ID: ${{ vars.AWS_STAGING_INSTANCE_ID }}
      IMAGE_REPOSITORY: ghcr.io/neuraln-cyber/gen-automation/control-plane-mega
      WORKER_IMAGE_REPOSITORY: ghcr.io/neuraln-cyber/gen-automation/gpu-worker
      I2V_WORKER_IMAGE_REPOSITORY: ghcr.io/neuraln-cyber/gen-automation/i2v-worker
      PUBLISH_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      # This is a second-level workflow_run event (CI -> publish -> deploy), so
      # do not infer the built revision from this run's head_sha. The exact SHA
      # is carried by the completed publication run's bounded metadata artifact.
      - name: Read the exact source revision from the publication run
        id: publication_metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PUBLISH_RUN_ID" =~ ^[0-9]+$ ]]
          artifact_count="$(
            gh api \
              --header 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${PUBLISH_RUN_ID}/artifacts" \
              --jq '[.artifacts[] | select(.name == "staging-deploy-source")] | length'
          )"
          if [ "$artifact_count" = "0" ]; then
            printf '%s\n' "The publication run did not publish a staging image; nothing will deploy."
            printf '%s\n' "available=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$artifact_count" = "1" ] || {
            printf '%s\n' "Publication run contains ambiguous staging metadata artifacts." >&2
            exit 1
          }
          metadata_dir="$RUNNER_TEMP/staging-deploy-source"
          mkdir --parents "$metadata_dir"
          gh run download "$PUBLISH_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name staging-deploy-source \
            --dir "$metadata_dir"
          source_revision="$(tr -d '\r\n' <"$metadata_dir/staging-source-revision")"
          worker_source_revision="$(
            tr -d '\r\n' <"$metadata_dir/staging-worker-source-revision"
          )"
          worker_image_digest="$(
            tr -d '\r\n' <"$metadata_dir/staging-worker-image-digest"
          )"
          i2v_worker_source_revision="$(
            tr -d '\r\n' <"$metadata_dir/staging-i2v-worker-source-revision"
          )"
          i2v_worker_image_digest="$(
            tr -d '\r\n' <"$metadata_dir/staging-i2v-worker-image-digest"
          )"
          [[ "$source_revision" =~ ^[0-9a-f]{40}$ ]] || {
            printf '%s\n' "Publication metadata does not contain a full lowercase Git SHA." >&2
            exit 1
          }
          [[ "$worker_source_revision" =~ ^[0-9a-f]{40}$ ]] || {
            printf '%s\n' "Publication metadata does not contain a full worker Git SHA." >&2
            exit 1
          }
          [[ "$worker_image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf '%s\n' "Publication metadata does not contain a valid worker digest." >&2
            exit 1
          }
          [[ "$i2v_worker_source_revision" =~ ^[0-9a-f]{40}$ ]] || {
            printf '%s\n' "Publication metadata does not contain a full I2V worker Git SHA." >&2
            exit 1
          }
          [[ "$i2v_worker_image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf '%s\n' "Publication metadata does not contain a valid I2V worker digest." >&2
            exit 1
          }
          printf 'SOURCE_REVISION=%s\n' "$source_revision" >>"$GITHUB_ENV"
          printf 'WORKER_SOURCE_REVISION=%s\n' "$worker_source_revision" >>"$GITHUB_ENV"
          printf 'PUBLISHED_WORKER_IMAGE_DIGEST=%s\n' \
            "$worker_image_digest" >>"$GITHUB_ENV"
          printf 'I2V_WORKER_SOURCE_REVISION=%s\n' \
            "$i2v_worker_source_revision" >>"$GITHUB_ENV"
          printf 'PUBLISHED_I2V_WORKER_IMAGE_DIGEST=%s\n' \
            "$i2v_worker_image_digest" >>"$GITHUB_ENV"
          printf '%s\n' "available=true" >>"$GITHUB_OUTPUT"

      - name: Require the published revision to remain the tip of main
        id: main_gate
        if: steps.publication_metadata.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
            printf '%s\n' "The publication source revision is not a full lowercase Git SHA." >&2
            exit 1
          }
          latest_main="$(
            gh api \
              --header 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          if [ "$SOURCE_REVISION" != "$latest_main" ]; then
            printf '%s\n' "A newer main revision exists; this stale publication will not deploy."
            printf '%s\n' "deploy=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "deploy=true" >>"$GITHUB_OUTPUT"

      - name: Resolve and verify the published immutable image
        if: steps.main_gate.outputs.deploy == 'true'
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          image_tag="${IMAGE_REPOSITORY}:sha-${SOURCE_REVISION}"
          worker_image_ref="${WORKER_IMAGE_REPOSITORY}@${PUBLISHED_WORKER_IMAGE_DIGEST}"
          i2v_worker_image_ref="${I2V_WORKER_IMAGE_REPOSITORY}@${PUBLISHED_I2V_WORKER_IMAGE_DIGEST}"
          manifest_json="$(
            docker buildx imagetools inspect \
              "$image_tag" \
              --format '{{json .Manifest}}'
          )"
          image_json="$(
            docker buildx imagetools inspect \
              "$image_tag" \
              --format '{{json .Image}}'
          )"
          worker_manifest_json="$(
            docker buildx imagetools inspect \
              "$worker_image_ref" \
              --format '{{json .Manifest}}'
          )"
          worker_image_json="$(
            docker buildx imagetools inspect \
              "$worker_image_ref" \
              --format '{{json .Image}}'
          )"
          i2v_worker_manifest_json="$(
            docker buildx imagetools inspect \
              "$i2v_worker_image_ref" \
              --format '{{json .Manifest}}'
          )"
          i2v_worker_image_json="$(
            docker buildx imagetools inspect \
              "$i2v_worker_image_ref" \
              --format '{{json .Image}}'
          )"
          image_digest="$(
            MANIFEST_JSON="$manifest_json" python3 -c \
              'import json, os; print(json.loads(os.environ["MANIFEST_JSON"])["digest"])'
          )"
          image_revision="$(
            IMAGE_JSON="$image_json" python3 -c \
              'import json, os; print(json.loads(os.environ["IMAGE_JSON"])["config"]["Labels"]["org.opencontainers.image.revision"])'
          )"
          worker_image_digest="$(
            MANIFEST_JSON="$worker_manifest_json" python3 -c \
              'import json, os; print(json.loads(os.environ["MANIFEST_JSON"])["digest"])'
          )"
          worker_image_revision="$(
            IMAGE_JSON="$worker_image_json" python3 -c \
              'import json, os; print(json.loads(os.environ["IMAGE_JSON"])["config"]["Labels"]["org.opencontainers.image.revision"])'
          )"
          i2v_worker_image_digest="$(
            MANIFEST_JSON="$i2v_worker_manifest_json" python3 -c \
              'import json, os; print(json.loads(os.environ["MANIFEST_JSON"])["digest"])'
          )"
          i2v_worker_image_revision="$(
            IMAGE_JSON="$i2v_worker_image_json" python3 -c \
              'import json, os; print(json.loads(os.environ["IMAGE_JSON"])["config"]["Labels"]["org.opencontainers.image.revision"])'
          )"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf '%s\n' "Registry did not return a valid immutable digest." >&2
            exit 1
          }
          [ "$image_revision" = "$SOURCE_REVISION" ] || {
            printf '%s\n' "Published image revision label does not match its workflow source." >&2
            exit 1
          }
          [[ "$worker_image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf '%s\n' "Registry did not return a valid immutable worker digest." >&2
            exit 1
          }
          [ "$worker_image_digest" = "$PUBLISHED_WORKER_IMAGE_DIGEST" ] || {
            printf '%s\n' "Published worker digest does not match deployment metadata." >&2
            exit 1
          }
          [ "$worker_image_revision" = "$WORKER_SOURCE_REVISION" ] || {
            printf '%s\n' "Published worker revision label does not match its workflow source." >&2
            exit 1
          }
          [[ "$i2v_worker_image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf '%s\n' "Registry did not return a valid immutable I2V worker digest." >&2
            exit 1
          }
          [ "$i2v_worker_image_digest" = "$PUBLISHED_I2V_WORKER_IMAGE_DIGEST" ] || {
            printf '%s\n' "Published I2V worker digest does not match deployment metadata." >&2
            exit 1
          }
          [ "$i2v_worker_image_revision" = "$I2V_WORKER_SOURCE_REVISION" ] || {
            printf '%s\n' "Published I2V worker revision label does not match its resolved input source." >&2
            exit 1
          }
          printf 'IMAGE_REF=%s@%s\n' "$IMAGE_REPOSITORY" "$image_digest" >>"$GITHUB_ENV"
          printf 'WORKER_IMAGE_REF=%s@%s\n' \
            "$WORKER_IMAGE_REPOSITORY" \
            "$worker_image_digest" >>"$GITHUB_ENV"
          printf 'I2V_WORKER_IMAGE_REF=%s@%s\n' \
            "$I2V_WORKER_IMAGE_REPOSITORY" \
            "$i2v_worker_image_digest" >>"$GITHUB_ENV"

      - name: Validate non-secret deployment coordinates
        if: steps.main_gate.outputs.deploy == 'true'
        shell: bash
        env:
          AWS_STAGING_DEPLOY_ROLE_ARN: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          [[ "$AWS_STAGING_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::861912887470:role/[A-Za-z0-9+=,.@_/-]+$ ]] || {
            printf '%s\n' "AWS_STAGING_DEPLOY_ROLE_ARN is missing or outside the staging account." >&2
            exit 1
          }
          [[ "$AWS_STAGING_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]] || {
            printf '%s\n' "AWS_STAGING_INSTANCE_ID is missing or invalid." >&2
            exit 1
          }

      - name: Exchange GitHub OIDC identity for the staging deploy role
        if: steps.main_gate.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          allowed-account-ids: "861912887470"
          role-duration-seconds: 3600
          role-session-name: gen-automation-staging-${{ github.run_id }}

      - name: Roll out through AWS Systems Manager
        if: steps.main_gate.outputs.deploy == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_REF" =~ ^ghcr\.io/neuraln-cyber/gen-automation/control-plane-mega@sha256:[0-9a-f]{64}$ ]]
          [[ "$WORKER_IMAGE_REF" =~ ^ghcr\.io/neuraln-cyber/gen-automation/gpu-worker@sha256:[0-9a-f]{64}$ ]]
          [[ "$I2V_WORKER_IMAGE_REF" =~ ^ghcr\.io/neuraln-cyber/gen-automation/i2v-worker@sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKER_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]

          latest_main="$(
            gh api \
              --header 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          if [ "$SOURCE_REVISION" != "$latest_main" ]; then
            printf '%s\n' "A newer main revision appeared before submission; this rollout is now a no-op."
            exit 0
          fi

          # Routine image rollout does not rerun the first-install host bundle.
          # Resolve the credential-free host deployment files from the exact
          # reviewed image revision, then make the host independently verify
          # those bytes before installing them. Compress the payloads
          # deterministically to stay comfortably inside the SSM command limit.
          host_bundle_dir="$RUNNER_TEMP/staging-host-bootstrap"
          mkdir --parents "$host_bundle_dir"
          for relative_path in \
            infra/aws-staging/deploy/bootstrap-mega-profile.sh \
            infra/aws-staging/deploy/compose.bootstrap.yaml \
            infra/aws-staging/deploy/update-control-plane.sh; do
            gh api \
              --header 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${relative_path}?ref=${SOURCE_REVISION}" \
              >"$host_bundle_dir/${relative_path##*/}"
          done
          bash -n "$host_bundle_dir/bootstrap-mega-profile.sh"
          bash -n "$host_bundle_dir/update-control-plane.sh"
          bootstrap_helper_sha256="$(sha256sum "$host_bundle_dir/bootstrap-mega-profile.sh" | cut -d' ' -f1)"
          bootstrap_compose_sha256="$(sha256sum "$host_bundle_dir/compose.bootstrap.yaml" | cut -d' ' -f1)"
          control_plane_updater_sha256="$(sha256sum "$host_bundle_dir/update-control-plane.sh" | cut -d' ' -f1)"
          bootstrap_helper_gzip_base64="$(gzip --best --no-name --stdout "$host_bundle_dir/bootstrap-mega-profile.sh" | base64 --wrap=0)"
          bootstrap_compose_gzip_base64="$(gzip --best --no-name --stdout "$host_bundle_dir/compose.bootstrap.yaml" | base64 --wrap=0)"
          control_plane_updater_gzip_base64="$(gzip --best --no-name --stdout "$host_bundle_dir/update-control-plane.sh" | base64 --wrap=0)"
          [[ "$bootstrap_helper_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$bootstrap_compose_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$control_plane_updater_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$bootstrap_helper_gzip_base64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          [[ "$bootstrap_compose_gzip_base64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          [[ "$control_plane_updater_gzip_base64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]

          parameters_file="$RUNNER_TEMP/ssm-parameters.json"
          SSM_IMAGE_REF="$IMAGE_REF" \
          SSM_WORKER_IMAGE_REF="$WORKER_IMAGE_REF" \
          SSM_SOURCE_REVISION="$SOURCE_REVISION" \
          SSM_BOOTSTRAP_HELPER_SHA256="$bootstrap_helper_sha256" \
          SSM_BOOTSTRAP_COMPOSE_SHA256="$bootstrap_compose_sha256" \
          SSM_CONTROL_PLANE_UPDATER_SHA256="$control_plane_updater_sha256" \
          SSM_BOOTSTRAP_HELPER_GZIP_BASE64="$bootstrap_helper_gzip_base64" \
          SSM_BOOTSTRAP_COMPOSE_GZIP_BASE64="$bootstrap_compose_gzip_base64" \
          SSM_CONTROL_PLANE_UPDATER_GZIP_BASE64="$control_plane_updater_gzip_base64" \
            python3 -c '
          import json
          import os
          import shlex

          image = os.environ["SSM_IMAGE_REF"]
          worker_image = os.environ["SSM_WORKER_IMAGE_REF"]
          revision = os.environ["SSM_SOURCE_REVISION"]
          bootstrap_helper_sha256 = os.environ["SSM_BOOTSTRAP_HELPER_SHA256"]
          bootstrap_compose_sha256 = os.environ["SSM_BOOTSTRAP_COMPOSE_SHA256"]
          control_plane_updater_sha256 = os.environ["SSM_CONTROL_PLANE_UPDATER_SHA256"]
          bootstrap_helper_gzip_base64 = os.environ["SSM_BOOTSTRAP_HELPER_GZIP_BASE64"]
          bootstrap_compose_gzip_base64 = os.environ["SSM_BOOTSTRAP_COMPOSE_GZIP_BASE64"]
          control_plane_updater_gzip_base64 = os.environ[
              "SSM_CONTROL_PLANE_UPDATER_GZIP_BASE64"
          ]
          runtime_env = "/etc/gen-automation/control-plane.env"
          runtime_env_backup = f"{runtime_env}.{revision}.rollback"
          worker_image_key = "GEN_AUTOMATION_SALAD_WORKER_IMAGE"
          update_runtime_images = """
          import os
          import pathlib
          import sys
          import tempfile

          path = pathlib.Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()
          arguments = sys.argv[2:]
          if len(arguments) % 2:
              raise SystemExit("runtime environment updates must be key/value pairs")
          for index in range(0, len(arguments), 2):
              key, value = arguments[index : index + 2]
              matches = [
                  index for index, line in enumerate(lines)
                  if line.startswith(f"{key}=")
              ]
              if len(matches) > 1:
                  raise SystemExit(f"{path} defines {key} more than once")
              if matches:
                  lines[matches[0]] = f"{key}={value}"
              else:
                  lines.append(f"{key}={value}")
          descriptor, temporary = tempfile.mkstemp(prefix=".control-plane.env.", dir=path.parent)
          try:
              with os.fdopen(descriptor, "w", encoding="utf-8") as output:
                  output.write("\\n".join(lines) + "\\n")
                  output.flush()
                  os.fsync(output.fileno())
              os.chown(temporary, 0, 0)
              os.chmod(temporary, 0o600)
              os.replace(temporary, path)
          finally:
              try:
                  os.unlink(temporary)
              except FileNotFoundError:
                  pass
          """
          backup_runtime_env = (
              "sudo /usr/bin/install -o root -g root -m 0600"
              f" {shlex.quote(runtime_env)} {shlex.quote(runtime_env_backup)}"
          )
          runtime_image_updates = [worker_image_key, worker_image]
          update_worker_references = (
              "sudo /usr/bin/python3 -c"
              f" {shlex.quote(update_runtime_images)}"
              f" {shlex.quote(runtime_env)}"
              + "".join(f" {shlex.quote(value)}" for value in runtime_image_updates)
          )
          remove_runtime_backup = f"sudo /usr/bin/rm -f -- {shlex.quote(runtime_env_backup)}"
          refresh_host_bootstrap = (
              "bundle_root=$(/usr/bin/mktemp --directory "
              "/tmp/gen-automation-host-bootstrap.XXXXXX)"
              " && trap '\''/usr/bin/rm -rf -- \"$bundle_root\"'\'' EXIT"
              " && /usr/bin/printf '\''%s'\''"
              f" {shlex.quote(bootstrap_helper_gzip_base64)}"
              " | /usr/bin/base64 --decode | /usr/bin/gzip --decompress"
              " >\"$bundle_root/bootstrap-mega-profile.sh\""
              " && /usr/bin/printf '\''%s'\''"
              f" {shlex.quote(bootstrap_compose_gzip_base64)}"
              " | /usr/bin/base64 --decode | /usr/bin/gzip --decompress"
              " >\"$bundle_root/compose.bootstrap.yaml\""
              " && /usr/bin/printf '\''%s'\''"
              f" {shlex.quote(control_plane_updater_gzip_base64)}"
              " | /usr/bin/base64 --decode | /usr/bin/gzip --decompress"
              " >\"$bundle_root/update-control-plane.sh\""
              " && /usr/bin/printf '\''%s  %s\\n'\''"
              f" {shlex.quote(bootstrap_helper_sha256)}"
              " \"$bundle_root/bootstrap-mega-profile.sh\""
              " | /usr/bin/sha256sum --check --status"
              " && /usr/bin/printf '\''%s  %s\\n'\''"
              f" {shlex.quote(bootstrap_compose_sha256)}"
              " \"$bundle_root/compose.bootstrap.yaml\""
              " | /usr/bin/sha256sum --check --status"
              " && /usr/bin/printf '\''%s  %s\\n'\''"
              f" {shlex.quote(control_plane_updater_sha256)}"
              " \"$bundle_root/update-control-plane.sh\""
              " | /usr/bin/sha256sum --check --status"
              " && /usr/bin/bash -n \"$bundle_root/bootstrap-mega-profile.sh\""
              " && /usr/bin/bash -n \"$bundle_root/update-control-plane.sh\""
              " && sudo /usr/bin/docker compose"
              " --env-file /etc/gen-automation/deploy.env"
              " --project-directory /opt/gen-automation/deploy"
              " --file /opt/gen-automation/deploy/compose.yaml"
              " --file \"$bundle_root/compose.bootstrap.yaml\""
              " --profile bootstrap config --quiet"
              " && sudo /usr/bin/install -o root -g root -m 0644"
              " \"$bundle_root/compose.bootstrap.yaml\""
              " /opt/gen-automation/deploy/compose.bootstrap.yaml"
              " && sudo /usr/bin/install -o root -g root -m 0755"
              " \"$bundle_root/bootstrap-mega-profile.sh\""
              " /usr/local/sbin/gen-automation-bootstrap-mega-profile"
              " && sudo /usr/bin/install -o root -g root -m 0755"
              " \"$bundle_root/update-control-plane.sh\""
              " /usr/local/sbin/gen-automation-update-control-plane"
              " && /usr/bin/printf '\''%s  %s\\n'\''"
              f" {shlex.quote(control_plane_updater_sha256)}"
              " /usr/local/sbin/gen-automation-update-control-plane"
              " | sudo /usr/bin/sha256sum --check --status"
          )
          restore_runtime_env = (
              "sudo /usr/bin/install -o root -g root -m 0600"
              f" {shlex.quote(runtime_env_backup)} {shlex.quote(runtime_env)}"
              " && sudo /usr/bin/systemctl restart --no-block gen-automation-staging.service"
              f" && {remove_runtime_backup}"
          )
          restore_runtime_env_stopped = (
              "sudo /usr/bin/systemctl stop gen-automation-staging.service"
              " && ! sudo /usr/bin/systemctl is-active --quiet"
              " gen-automation-staging.service"
              " && sudo /usr/bin/install -o root -g root -m 0600"
              f" {shlex.quote(runtime_env_backup)} {shlex.quote(runtime_env)}"
              f" && {remove_runtime_backup}"
          )
          migration_preflight = (
              "sudo /usr/local/libexec/"
              "gen-automation-validate-migration-environment"
          )
          stop_control_plane = (
              "sudo /usr/bin/systemctl stop gen-automation-staging.service"
              " && ! sudo /usr/bin/systemctl is-active --quiet"
              " gen-automation-staging.service"
          )
          migration_command = (
              "sudo /usr/bin/timeout --signal=TERM --kill-after=30s 600s"
              " /usr/bin/docker run --rm"
              " --network bridge"
              " --user 10001:10001"
              " --read-only"
              " --env-file /etc/gen-automation/migration.env"
              " --mount type=bind,src=/etc/gen-automation/rds-global-bundle.pem,dst=/run/gen-automation/rds-global-bundle.pem,readonly"
              " --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,uid=10001,gid=10001,mode=1770"
              " --cap-drop ALL"
              " --security-opt no-new-privileges:true"
              f" {shlex.quote(image)}"
              " python3.12 -m alembic upgrade head"
          )
          rollout_command = (
              "sudo /usr/local/sbin/gen-automation-update-control-plane"
              f" --image {shlex.quote(image)} --revision {shlex.quote(revision)}"
              " --rollback-mode leave-stopped"
              " --external-lock-held"
          )
          unlocked_command = (
              f"{migration_preflight} && {refresh_host_bootstrap} && "
              f"{backup_runtime_env} && "
              f"( if {stop_control_plane} && {update_worker_references}; then "
              f"if {migration_command}; then "
              f"( {rollout_command} && {remove_runtime_backup} ) || "
              f"( {restore_runtime_env_stopped}; false ); "
              f"else ( {restore_runtime_env_stopped}; false ); fi; "
              f"else ( {restore_runtime_env}; false ); fi )"
          )
          command = (
              "sudo /usr/bin/flock --exclusive --wait 120"
              " /run/lock/gen-automation-control-plane-update.lock"
              " /usr/bin/bash -c"
              f" {shlex.quote(unlocked_command)}"
          )
          command_size = len(command.encode("utf-8"))
          if command_size > 24_000:
              raise SystemExit(f"SSM command is too large: {command_size} bytes")
          print(json.dumps({"commands": [command]}))
          ' >"$parameters_file"

          command_id="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$AWS_STAGING_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Immutable control-plane rollout for ${SOURCE_REVISION}" \
              --timeout-seconds 2100 \
              --parameters "file://${parameters_file}" \
              --query 'Command.CommandId' \
              --output text
          )"

          final_status=""
          for _ in $(seq 1 420); do
            final_status="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$command_id" \
                --instance-id "$AWS_STAGING_INSTANCE_ID" \
                --query 'Status' \
                --output text 2>/dev/null || true
            )"
            case "$final_status" in
              Success|Cancelled|TimedOut|Failed|Cancelling) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$AWS_STAGING_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
          [ "$final_status" = "Success" ] || {
            printf '%s\n' "SSM rollout finished with status: ${final_status:-unknown}" >&2
            exit 1
          }

  semantic-anatomy:
    name: ${{ inputs.operation }} staging anatomy coverage
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.component == 'semantic-anatomy'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AWS_REGION: eu-central-1
      AWS_STAGING_INSTANCE_ID: ${{ vars.AWS_STAGING_INSTANCE_ID }}
      OPERATION: ${{ inputs.operation }}
      MAX_ASSESSMENTS: ${{ inputs.max_assessments }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Check out the exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate bounded public inputs
        shell: bash
        env:
          AWS_STAGING_DEPLOY_ROLE_ARN: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MAX_ASSESSMENTS" =~ ^[1-9][0-9]{0,3}$ ]]
          [ "$MAX_ASSESSMENTS" -le 1000 ]
          case "$OPERATION" in status|dry-run|promote|pause) ;; *) exit 1 ;; esac
          [[ "$AWS_STAGING_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]
          [[ "$AWS_STAGING_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::861912887470:role/[A-Za-z0-9+=,.@_/-]+$ ]]
          script_path="infra/aws-staging/deploy/promote-semantic-anatomy.sh"
          printf 'SCRIPT_SHA256=%s\n' "$(sha256sum "$script_path" | cut -d' ' -f1)" >>"$GITHUB_ENV"

      - name: Exchange GitHub OIDC identity for the staging deploy role
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          allowed-account-ids: "861912887470"
          role-duration-seconds: 1800
          role-session-name: gen-automation-anatomy-${{ github.run_id }}

      - name: Run the pinned promotion command through Systems Manager
        shell: bash
        run: |
          set -euo pipefail
          parameters_file="$RUNNER_TEMP/semantic-anatomy-parameters.json"
          SSM_INSTANCE_ID="$AWS_STAGING_INSTANCE_ID" \
          SSM_OPERATION="$OPERATION" \
          SSM_MAX="$MAX_ASSESSMENTS" \
          SSM_REVISION="$SOURCE_REVISION" \
          SSM_SCRIPT_SHA256="$SCRIPT_SHA256" \
            python3 -c '
          import json
          import os
          import shlex

          operation = os.environ["SSM_OPERATION"]
          maximum = os.environ["SSM_MAX"]
          revision = os.environ["SSM_REVISION"]
          checksum = os.environ["SSM_SCRIPT_SHA256"]
          source = (
              "https://raw.githubusercontent.com/neuraln-cyber/gen-automation/"
              f"{revision}/infra/aws-staging/deploy/promote-semantic-anatomy.sh"
          )
          flag = {
              "status": "--status",
              "dry-run": "--dry-run",
              "promote": "--promote",
              "pause": "--pause",
          }[operation]
          revision_guard = (
              f" --expected-control-plane-revision {shlex.quote(revision)}"
              if operation in {"dry-run", "promote"}
              else ""
          )
          inner = (
              "set -Eeuo pipefail; "
              "script_file=$(/usr/bin/mktemp); "
              "trap '\''/usr/bin/rm -f -- \"$script_file\"'\'' EXIT; "
              "/usr/bin/curl --fail --location --proto '\''=https'\'' --proto-redir '\''=https'\'' "
              "--retry 3 --retry-all-errors --silent --show-error "
              f"--output \"$script_file\" {shlex.quote(source)}; "
              f"printf '\''%s  %s\\n'\'' {shlex.quote(checksum)} \"$script_file\" | "
              "/usr/bin/sha256sum --check --status; "
              f"/usr/bin/bash \"$script_file\" {flag} --max-assessments {shlex.quote(maximum)} "
              f"{revision_guard}"
          )
          command = f"sudo /usr/bin/bash -c {shlex.quote(inner)}"
          print(json.dumps({"commands": [command]}))
          ' >"$parameters_file"

          command_id="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$AWS_STAGING_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Semantic anatomy ${OPERATION} at ${SOURCE_REVISION}" \
              --timeout-seconds 1200 \
              --parameters "file://${parameters_file}" \
              --query 'Command.CommandId' \
              --output text
          )"

          final_status=""
          for _ in $(seq 1 250); do
            final_status="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$command_id" \
                --instance-id "$AWS_STAGING_INSTANCE_ID" \
                --query 'Status' \
                --output text 2>/dev/null || true
            )"
            case "$final_status" in
              Success|Cancelled|TimedOut|Failed|Cancelling) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$AWS_STAGING_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
          [ "$final_status" = "Success" ] || {
            printf '%s\n' "SSM anatomy command finished with status: ${final_status:-unknown}" >&2
            exit 1
          }

  lora-manager:
    name: ${{ inputs.operation }} staging LoRA manager
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.component == 'lora-manager'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWS_REGION: eu-central-1
      AWS_STAGING_INSTANCE_ID: ${{ vars.AWS_STAGING_INSTANCE_ID }}
      AWS_STAGING_CIVITAI_API_SECRET_ARN: ${{ vars.AWS_STAGING_CIVITAI_API_SECRET_ARN }}
      AWS_STAGING_LORA_MANAGER_PREREQUISITES_APPLIED: ${{ vars.AWS_STAGING_LORA_MANAGER_PREREQUISITES_APPLIED }}
      OPERATION: ${{ inputs.operation }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Check out the exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate non-secret LoRA-manager promotion coordinates
        shell: bash
        env:
          AWS_STAGING_DEPLOY_ROLE_ARN: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          case "$OPERATION" in status|enable|disable) ;; *) exit 1 ;; esac
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AWS_STAGING_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]
          [[ "$AWS_STAGING_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::861912887470:role/[A-Za-z0-9+=,.@_/-]+$ ]]
          if [ "$OPERATION" = "enable" ]; then
            [[ "$AWS_STAGING_CIVITAI_API_SECRET_ARN" =~ ^arn:aws:secretsmanager:eu-central-1:861912887470:secret:gen-automation/staging/civitai-[A-Za-z0-9]{6}$ ]] || {
              printf '%s\n' "The exact configured staging Civitai ARN is missing or invalid." >&2
              exit 1
            }
            [ "$AWS_STAGING_LORA_MANAGER_PREREQUISITES_APPLIED" = "true" ] || {
              printf '%s\n' "Enablement is blocked until the reviewed CORS/IAM/secret infrastructure apply is attested." >&2
              exit 1
            }
          fi
          bash -n infra/aws-staging/deploy/configure-lora-manager.sh
          bash -n infra/aws-staging/deploy/validate-deployment.sh
          printf 'CONFIGURATOR_SHA256=%s\n' "$(sha256sum infra/aws-staging/deploy/configure-lora-manager.sh | cut -d' ' -f1)" >>"$GITHUB_ENV"
          printf 'VALIDATOR_SHA256=%s\n' "$(sha256sum infra/aws-staging/deploy/validate-deployment.sh | cut -d' ' -f1)" >>"$GITHUB_ENV"

      - name: Exchange GitHub OIDC identity for the staging deploy role
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          allowed-account-ids: "861912887470"
          role-duration-seconds: 1800
          role-session-name: gen-automation-lora-${{ github.run_id }}

      - name: Run the pinned LoRA-manager operation through Systems Manager
        shell: bash
        run: |
          set -euo pipefail
          configurator_payload="$(gzip --best --no-name --stdout infra/aws-staging/deploy/configure-lora-manager.sh | base64 --wrap=0)"
          validator_payload="$(gzip --best --no-name --stdout infra/aws-staging/deploy/validate-deployment.sh | base64 --wrap=0)"
          [[ "$CONFIGURATOR_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$VALIDATOR_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$configurator_payload" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          [[ "$validator_payload" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]

          parameters_file="$RUNNER_TEMP/lora-manager-parameters.json"
          SSM_OPERATION="$OPERATION" \
          SSM_CIVITAI_API_SECRET_ARN="$AWS_STAGING_CIVITAI_API_SECRET_ARN" \
          SSM_SOURCE_REVISION="$SOURCE_REVISION" \
          SSM_CONFIGURATOR_SHA256="$CONFIGURATOR_SHA256" \
          SSM_VALIDATOR_SHA256="$VALIDATOR_SHA256" \
          SSM_CONFIGURATOR_PAYLOAD="$configurator_payload" \
          SSM_VALIDATOR_PAYLOAD="$validator_payload" \
            python3 -c '
          import json
          import os
          import shlex

          operation = os.environ["SSM_OPERATION"]
          secret_arn = os.environ["SSM_CIVITAI_API_SECRET_ARN"]
          revision = os.environ["SSM_SOURCE_REVISION"]
          configurator_sha256 = os.environ["SSM_CONFIGURATOR_SHA256"]
          validator_sha256 = os.environ["SSM_VALIDATOR_SHA256"]
          configurator_payload = os.environ["SSM_CONFIGURATOR_PAYLOAD"]
          validator_payload = os.environ["SSM_VALIDATOR_PAYLOAD"]
          operation_arguments = {
              "status": "--status",
              "disable": "--disable --validator \"$payload_root/validate-deployment.sh\"",
              "enable": (
                  "--enable --civitai-secret-arn "
                  f"{shlex.quote(secret_arn)} "
                  "--expected-control-plane-revision "
                  f"{shlex.quote(revision)} "
                  "--validator \"$payload_root/validate-deployment.sh\""
              ),
          }[operation]
          command = (
              "set -Eeuo pipefail; "
              "payload_root=$(/usr/bin/mktemp --directory /tmp/gen-automation-lora-manager.XXXXXX); "
              "trap '\''/usr/bin/rm -rf -- \"$payload_root\"'\'' EXIT; "
              "/usr/bin/printf '\''%s'\'' "
              f"{shlex.quote(configurator_payload)} "
              "| /usr/bin/base64 --decode | /usr/bin/gzip --decompress "
              ">\"$payload_root/configure-lora-manager.sh\"; "
              "/usr/bin/printf '\''%s'\'' "
              f"{shlex.quote(validator_payload)} "
              "| /usr/bin/base64 --decode | /usr/bin/gzip --decompress "
              ">\"$payload_root/validate-deployment.sh\"; "
              "/usr/bin/printf '\''%s  %s\\n'\'' "
              f"{shlex.quote(configurator_sha256)} "
              "\"$payload_root/configure-lora-manager.sh\" "
              "| /usr/bin/sha256sum --check --status; "
              "/usr/bin/printf '\''%s  %s\\n'\'' "
              f"{shlex.quote(validator_sha256)} "
              "\"$payload_root/validate-deployment.sh\" "
              "| /usr/bin/sha256sum --check --status; "
              "/usr/bin/bash -n \"$payload_root/configure-lora-manager.sh\"; "
              "/usr/bin/bash -n \"$payload_root/validate-deployment.sh\"; "
              "sudo /usr/bin/bash \"$payload_root/configure-lora-manager.sh\" "
              f"{operation_arguments}"
          )
          if len(command.encode("utf-8")) > 24_000:
              raise SystemExit("SSM command exceeds the reviewed size bound")
          print(json.dumps({"commands": [command]}))
          ' >"$parameters_file"

          command_id="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$AWS_STAGING_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "${OPERATION} staging LoRA manager at ${SOURCE_REVISION}" \
              --timeout-seconds 1500 \
              --parameters "file://${parameters_file}" \
              --query 'Command.CommandId' \
              --output text
          )"

          final_status=""
          for _ in $(seq 1 300); do
            final_status="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$command_id" \
                --instance-id "$AWS_STAGING_INSTANCE_ID" \
                --query 'Status' \
                --output text 2>/dev/null || true
            )"
            case "$final_status" in
              Success|Cancelled|TimedOut|Failed|Cancelling) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$AWS_STAGING_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
          [ "$final_status" = "Success" ] || {
            printf '%s\n' "LoRA manager operation finished with status: ${final_status:-unknown}" >&2
            exit 1
          }

  i2v-lora-worker:
    name: ${{ inputs.operation }} staging I2V LoRA worker
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.component == 'i2v-lora-worker'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      AWS_REGION: eu-central-1
      AWS_STAGING_INSTANCE_ID: ${{ vars.AWS_STAGING_INSTANCE_ID }}
      OPERATION: ${{ inputs.operation }}
      SOURCE_REVISION: ${{ github.sha }}
      EXPECTED_WORKER_IMAGE: ${{ inputs.i2v_worker_image }}
      EXPECTED_WORKER_SOURCE_REVISION: ${{ inputs.i2v_worker_source_revision }}
    steps:
      - name: Check out the exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the bounded I2V LoRA worker operation
        shell: bash
        env:
          AWS_STAGING_DEPLOY_ROLE_ARN: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          case "$OPERATION" in status|dry-run|promote|rollback) ;; *) exit 1 ;; esac
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AWS_STAGING_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]
          [[ "$AWS_STAGING_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::861912887470:role/[A-Za-z0-9+=,.@_/-]+$ ]]
          if [ "$OPERATION" = "rollback" ]; then
            [ -z "$EXPECTED_WORKER_IMAGE" ]
            [ -z "$EXPECTED_WORKER_SOURCE_REVISION" ]
          else
            [[ "$EXPECTED_WORKER_IMAGE" =~ ^ghcr\.io/neuraln-cyber/gen-automation/i2v-worker@sha256:[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_WORKER_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          fi
          bash -n infra/aws-staging/deploy/rollout-i2v-lora-worker.sh
          printf 'I2V_ROLLOUT_SCRIPT_SHA256=%s\n' \
            "$(sha256sum infra/aws-staging/deploy/rollout-i2v-lora-worker.sh | cut -d' ' -f1)" \
            >>"$GITHUB_ENV"

      - name: Bind the immutable worker digest to its intrinsic source revision
        if: inputs.operation != 'rollback'
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          manifest_json="$(
            docker buildx imagetools inspect \
              "$EXPECTED_WORKER_IMAGE" \
              --format '{{json .Manifest}}'
          )"
          image_json="$(
            docker buildx imagetools inspect \
              "$EXPECTED_WORKER_IMAGE" \
              --format '{{json .Image}}'
          )"
          actual_digest="$(
            MANIFEST_JSON="$manifest_json" python3 -c \
              'import json, os; print(json.loads(os.environ["MANIFEST_JSON"])["digest"])'
          )"
          actual_revision="$(
            IMAGE_JSON="$image_json" python3 -c \
              'import json, os; print(json.loads(os.environ["IMAGE_JSON"])["config"]["Labels"]["org.opencontainers.image.revision"])'
          )"
          [ "${EXPECTED_WORKER_IMAGE#*@}" = "$actual_digest" ] || {
            printf '%s\n' "I2V worker registry digest differs from the requested digest." >&2
            exit 1
          }
          [ "$actual_revision" = "$EXPECTED_WORKER_SOURCE_REVISION" ] || {
            printf '%s\n' "I2V worker revision label differs from the requested source." >&2
            exit 1
          }

      - name: Exchange GitHub OIDC identity for the staging deploy role
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          allowed-account-ids: "861912887470"
          role-duration-seconds: 20400
          role-session-name: gen-automation-i2v-worker-${{ github.run_id }}

      - name: Run the checksum-pinned worker operation through Systems Manager
        shell: bash
        run: |
          set -euo pipefail
          script_payload="$(gzip --best --no-name --stdout infra/aws-staging/deploy/rollout-i2v-lora-worker.sh | base64 --wrap=0)"
          [[ "$I2V_ROLLOUT_SCRIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$script_payload" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          parameters_file="$RUNNER_TEMP/i2v-lora-worker-parameters.json"
          SSM_OPERATION="$OPERATION" \
          SSM_SOURCE_REVISION="$SOURCE_REVISION" \
          SSM_WORKER_IMAGE="$EXPECTED_WORKER_IMAGE" \
          SSM_WORKER_SOURCE_REVISION="$EXPECTED_WORKER_SOURCE_REVISION" \
          SSM_SCRIPT_SHA256="$I2V_ROLLOUT_SCRIPT_SHA256" \
          SSM_SCRIPT_PAYLOAD="$script_payload" \
            python3 -c '
          import json
          import os
          import shlex

          operation = os.environ["SSM_OPERATION"]
          revision = os.environ["SSM_SOURCE_REVISION"]
          worker_image = os.environ["SSM_WORKER_IMAGE"]
          worker_revision = os.environ["SSM_WORKER_SOURCE_REVISION"]
          checksum = os.environ["SSM_SCRIPT_SHA256"]
          payload = os.environ["SSM_SCRIPT_PAYLOAD"]
          arguments = "--" + operation + " --expected-control-plane-revision " + shlex.quote(revision)
          if operation != "rollback":
              arguments += (
                  " --expected-worker-image " + shlex.quote(worker_image)
                  + " --expected-worker-source-revision " + shlex.quote(worker_revision)
              )
          command = (
              "set -Eeuo pipefail; "
              "payload_root=$(/usr/bin/mktemp --directory /tmp/gen-automation-i2v-worker.XXXXXX); "
              "trap '\''/usr/bin/rm -rf -- \"$payload_root\"'\'' EXIT; "
              "/usr/bin/printf '\''%s'\'' " + shlex.quote(payload)
              + " | /usr/bin/base64 --decode | /usr/bin/gzip --decompress"
              " >\"$payload_root/rollout-i2v-lora-worker.sh\"; "
              "/usr/bin/printf '\''%s  %s\\n'\'' " + shlex.quote(checksum)
              + " \"$payload_root/rollout-i2v-lora-worker.sh\""
              " | /usr/bin/sha256sum --check --status; "
              "/usr/bin/bash -n \"$payload_root/rollout-i2v-lora-worker.sh\"; "
              "sudo /usr/bin/bash \"$payload_root/rollout-i2v-lora-worker.sh\" "
              + arguments
          )
          if len(command.encode("utf-8")) > 24_000:
              raise SystemExit("SSM command exceeds the reviewed size bound")
          print(
              json.dumps(
                  {
                      "commands": [command],
                      "executionTimeout": ["19000"],
                  }
              )
          )
          ' >"$parameters_file"

          command_id="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$AWS_STAGING_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "${OPERATION} staging I2V LoRA worker at ${SOURCE_REVISION}" \
              --timeout-seconds 180 \
              --parameters "file://${parameters_file}" \
              --query 'Command.CommandId' \
              --output text
          )"
          final_status=""
          for _ in $(seq 1 3900); do
            final_status="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$command_id" \
                --instance-id "$AWS_STAGING_INSTANCE_ID" \
                --query 'Status' \
                --output text 2>/dev/null || true
            )"
            case "$final_status" in
              Success|Cancelled|TimedOut|Failed|Cancelling) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$AWS_STAGING_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
          [ "$final_status" = "Success" ] || {
            printf '%s\n' "I2V LoRA worker operation finished with status: ${final_status:-unknown}" >&2
            exit 1
          }

  i2v-lora-profile:
    name: ${{ inputs.operation }} staging I2V LoRA public profile
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.component == 'i2v-lora-profile'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      AWS_REGION: eu-central-1
      AWS_STAGING_INSTANCE_ID: ${{ vars.AWS_STAGING_INSTANCE_ID }}
      OPERATION: ${{ inputs.operation }}
      SOURCE_REVISION: ${{ github.sha }}
      EXPECTED_WORKER_IMAGE: ${{ inputs.i2v_worker_image }}
      EXPECTED_WORKER_SOURCE_REVISION: ${{ inputs.i2v_worker_source_revision }}
      EXPECTED_ARTIFACT_IDENTITY_SHA256: 68f6c28831ac2a8e1801ba420c9816a29e09c8cc4738aae85611955553a3d301
      EXPECTED_PRIVATE_MANIFEST_SHA256: f0cd579606c8bc7fbf77ee8353b5c542395576d08f21e9acea37a1e2de19876e
      EXPECTED_MODEL_MANIFEST_SHA256: ebdeca736ee3e9ea4e4b7118c9e4b54dfcfd1bbde5a761f424aa85b1670b806f
      EXPECTED_WORKER_MODEL_OBJECTS_SHA256: be5802ffc52ee6bfa6c64a135dfdef37e4e0274e4098c9eb87e4edaafc4719a6
    steps:
      - name: Check out the exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate bounded I2V LoRA profile coordinates
        shell: bash
        env:
          AWS_STAGING_DEPLOY_ROLE_ARN: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          case "$OPERATION" in status|enable|disable) ;; *) exit 1 ;; esac
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AWS_STAGING_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]
          [[ "$AWS_STAGING_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::861912887470:role/[A-Za-z0-9+=,.@_/-]+$ ]]
          if [ "$OPERATION" = "disable" ]; then
            [ -z "$EXPECTED_WORKER_IMAGE" ]
            [ -z "$EXPECTED_WORKER_SOURCE_REVISION" ]
          else
            [[ "$EXPECTED_WORKER_IMAGE" =~ ^ghcr\.io/neuraln-cyber/gen-automation/i2v-worker@sha256:[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_WORKER_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          fi
          [ "$EXPECTED_PRIVATE_MANIFEST_SHA256" = "f0cd579606c8bc7fbf77ee8353b5c542395576d08f21e9acea37a1e2de19876e" ]
          [ "$EXPECTED_MODEL_MANIFEST_SHA256" = "ebdeca736ee3e9ea4e4b7118c9e4b54dfcfd1bbde5a761f424aa85b1670b806f" ]
          [ "$EXPECTED_WORKER_MODEL_OBJECTS_SHA256" = "be5802ffc52ee6bfa6c64a135dfdef37e4e0274e4098c9eb87e4edaafc4719a6" ]
          [ "$EXPECTED_ARTIFACT_IDENTITY_SHA256" = "68f6c28831ac2a8e1801ba420c9816a29e09c8cc4738aae85611955553a3d301" ]
          bash -n infra/aws-staging/deploy/configure-i2v-lora-profile.sh
          printf 'PROFILE_SCRIPT_SHA256=%s\n' "$(sha256sum infra/aws-staging/deploy/configure-i2v-lora-profile.sh | cut -d' ' -f1)" >>"$GITHUB_ENV"

      - name: Re-verify the worker image source binding before public exposure
        if: inputs.operation != 'disable'
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          manifest_json="$(
            docker buildx imagetools inspect \
              "$EXPECTED_WORKER_IMAGE" \
              --format '{{json .Manifest}}'
          )"
          image_json="$(
            docker buildx imagetools inspect \
              "$EXPECTED_WORKER_IMAGE" \
              --format '{{json .Image}}'
          )"
          actual_digest="$(
            MANIFEST_JSON="$manifest_json" python3 -c \
              'import json, os; print(json.loads(os.environ["MANIFEST_JSON"])["digest"])'
          )"
          actual_revision="$(
            IMAGE_JSON="$image_json" python3 -c \
              'import json, os; print(json.loads(os.environ["IMAGE_JSON"])["config"]["Labels"]["org.opencontainers.image.revision"])'
          )"
          [ "${EXPECTED_WORKER_IMAGE#*@}" = "$actual_digest" ]
          [ "$actual_revision" = "$EXPECTED_WORKER_SOURCE_REVISION" ]

      - name: Exchange GitHub OIDC identity for the staging deploy role
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          allowed-account-ids: "861912887470"
          role-duration-seconds: 6600
          role-session-name: gen-automation-i2v-profile-${{ github.run_id }}

      - name: Run the pinned I2V LoRA profile operation through Systems Manager
        shell: bash
        run: |
          set -euo pipefail
          script_payload="$(gzip --best --no-name --stdout infra/aws-staging/deploy/configure-i2v-lora-profile.sh | base64 --wrap=0)"
          [[ "$PROFILE_SCRIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$script_payload" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          parameters_file="$RUNNER_TEMP/i2v-lora-profile-parameters.json"
          SSM_OPERATION="$OPERATION" \
          SSM_SOURCE_REVISION="$SOURCE_REVISION" \
          SSM_WORKER_IMAGE="$EXPECTED_WORKER_IMAGE" \
          SSM_WORKER_SOURCE_REVISION="$EXPECTED_WORKER_SOURCE_REVISION" \
          SSM_MANIFEST_SHA256="$EXPECTED_PRIVATE_MANIFEST_SHA256" \
          SSM_MODEL_MANIFEST_SHA256="$EXPECTED_MODEL_MANIFEST_SHA256" \
          SSM_WORKER_MODEL_OBJECTS_SHA256="$EXPECTED_WORKER_MODEL_OBJECTS_SHA256" \
          SSM_ARTIFACT_IDENTITY_SHA256="$EXPECTED_ARTIFACT_IDENTITY_SHA256" \
          SSM_SCRIPT_SHA256="$PROFILE_SCRIPT_SHA256" \
          SSM_SCRIPT_PAYLOAD="$script_payload" \
            python3 -c '
          import json
          import os
          import shlex

          operation = os.environ["SSM_OPERATION"]
          revision = os.environ["SSM_SOURCE_REVISION"]
          worker_image = os.environ["SSM_WORKER_IMAGE"]
          worker_revision = os.environ["SSM_WORKER_SOURCE_REVISION"]
          manifest_sha256 = os.environ["SSM_MANIFEST_SHA256"]
          model_manifest_sha256 = os.environ["SSM_MODEL_MANIFEST_SHA256"]
          worker_model_objects_sha256 = os.environ["SSM_WORKER_MODEL_OBJECTS_SHA256"]
          artifact_identity = os.environ["SSM_ARTIFACT_IDENTITY_SHA256"]
          checksum = os.environ["SSM_SCRIPT_SHA256"]
          payload = os.environ["SSM_SCRIPT_PAYLOAD"]
          arguments = f"--{operation}"
          if operation in {"status", "enable"}:
              arguments += (
                  " --expected-control-plane-revision " + shlex.quote(revision)
                  + " --expected-worker-image " + shlex.quote(worker_image)
                  + " --expected-worker-source-revision " + shlex.quote(worker_revision)
                  + " --expected-private-manifest-sha256 " + shlex.quote(manifest_sha256)
                  + " --expected-model-manifest-sha256 " + shlex.quote(model_manifest_sha256)
                  + " --expected-worker-model-objects-sha256 " + shlex.quote(worker_model_objects_sha256)
                  + " --expected-artifact-identity-sha256 " + shlex.quote(artifact_identity)
              )
          command = (
              "set -Eeuo pipefail; "
              "payload_root=$(/usr/bin/mktemp --directory /tmp/gen-automation-i2v-profile.XXXXXX); "
              "trap '\''/usr/bin/rm -rf -- \"$payload_root\"'\'' EXIT; "
              "/usr/bin/printf '\''%s'\'' " + shlex.quote(payload)
              + " | /usr/bin/base64 --decode | /usr/bin/gzip --decompress"
              " >\"$payload_root/configure-i2v-lora-profile.sh\"; "
              "/usr/bin/printf '\''%s  %s\\n'\'' " + shlex.quote(checksum)
              + " \"$payload_root/configure-i2v-lora-profile.sh\""
              " | /usr/bin/sha256sum --check --status; "
              "/usr/bin/bash -n \"$payload_root/configure-i2v-lora-profile.sh\"; "
              "sudo /usr/bin/bash \"$payload_root/configure-i2v-lora-profile.sh\" "
              + arguments
          )
          if len(command.encode("utf-8")) > 24_000:
              raise SystemExit("SSM command exceeds the reviewed size bound")
          print(
              json.dumps(
                  {
                      "commands": [command],
                      "executionTimeout": ["5400"],
                  }
              )
          )
          ' >"$parameters_file"

          command_id="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$AWS_STAGING_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "${OPERATION} staging I2V LoRA profile at ${SOURCE_REVISION}" \
              --timeout-seconds 120 \
              --parameters "file://${parameters_file}" \
              --query 'Command.CommandId' \
              --output text
          )"
          final_status=""
          for _ in $(seq 1 1140); do
            final_status="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$command_id" \
                --instance-id "$AWS_STAGING_INSTANCE_ID" \
                --query 'Status' \
                --output text 2>/dev/null || true
            )"
            case "$final_status" in
              Success|Cancelled|TimedOut|Failed|Cancelling) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$AWS_STAGING_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
          [ "$final_status" = "Success" ] || {
            printf '%s\n' "I2V LoRA profile operation finished with status: ${final_status:-unknown}" >&2
            exit 1
          }
