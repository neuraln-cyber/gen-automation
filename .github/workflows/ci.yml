name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          binary="${RUNNER_TEMP}/gitleaks"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "${GITLEAKS_ARCHIVE_SHA256}" "${archive}" \
            | sha256sum --check --strict -
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks
          chmod 0555 "${binary}"
          test "$("${binary}" version)" = "${GITLEAKS_VERSION}"
      - name: Scan complete Git history for secrets
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-inside-work-tree)" = "true"
          test "$(git rev-list --all --count)" -gt 0
          test ! -e "$(git rev-parse --git-path shallow)"
          oversized_blobs="$(
            git rev-list --objects --all \
              | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' \
              | awk '$1 == "blob" && $2 > 20971520 { print }'
          )"
          if [[ -n "${oversized_blobs}" ]]; then
            echo "::error::Secret scan refuses Git blobs larger than 20 MiB:"
            printf '%s\n' "${oversized_blobs}"
            exit 1
          fi
          "${RUNNER_TEMP}/gitleaks" git \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --max-archive-depth=1 \
            --max-decode-depth=5 \
            --max-target-megabytes=20 \
            --timeout=300 \
            --redact=100 \
            --no-banner \
            --no-color \
            --verbose \
            .

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Test
        run: python -m pytest --cov=gen_automation --cov-report=term-missing

  postgresql-migrations:
    name: PostgreSQL migration contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14-alpine3.24
        env:
          POSTGRES_DB: gen_automation_ci
          POSTGRES_USER: gen_automation_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gen_automation_ci -d gen_automation_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GEN_AUTOMATION_ENVIRONMENT: test
      GEN_AUTOMATION_DATABASE_URL: >-
        postgresql+psycopg://gen_automation_ci:ci-only-postgres-password@127.0.0.1:5432/gen_automation_ci
      GEN_AUTOMATION_SESSION_SECRET: ci-session-secret-with-more-than-32-characters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Exercise PostgreSQL upgrade and downgrade path
        run: |
          set -euo pipefail
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build control-plane image
        run: docker build --tag gen-automation-control-plane:test .
      - name: Build digest-pinned GPU worker image
        run: docker build --file Dockerfile.worker --tag gen-automation-gpu-worker:test .
      - name: Build semantic gateway image
        run: >-
          docker build
          --file Dockerfile.semantic-gateway
          --tag gen-automation-semantic-gateway:test
          .
      - name: Build MEGA-enabled control-plane image
        run: >-
          docker build
          --file Dockerfile.mega
          --tag gen-automation-control-plane-mega:test
          .
      - name: Build Patreon browser sidecar image
        run: >-
          docker build
          --file Dockerfile.patreon-browser
          --tag gen-automation-patreon-browser:test
          .
      - name: Generate control-plane image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: gen-automation-control-plane:test
          format: spdx-json
          output-file: control-plane.spdx.json
          syft-version: v1.42.3
          github-token: ""
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Generate GPU worker image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: gen-automation-gpu-worker:test
          format: spdx-json
          output-file: gpu-worker.spdx.json
          syft-version: v1.42.3
          github-token: ""
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Generate semantic gateway image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: gen-automation-semantic-gateway:test
          format: spdx-json
          output-file: semantic-gateway.spdx.json
          syft-version: v1.42.3
          github-token: ""
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Generate MEGA-enabled control-plane image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: gen-automation-control-plane-mega:test
          format: spdx-json
          output-file: control-plane-mega.spdx.json
          syft-version: v1.42.3
          github-token: ""
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Generate Patreon browser sidecar image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: gen-automation-patreon-browser:test
          format: spdx-json
          output-file: patreon-browser.spdx.json
          syft-version: v1.42.3
          github-token: ""
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Scan control-plane image SBOM
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: control-plane.spdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: table
          grype-version: v0.110.0
          cache-db: false
          only-fixed: true
      - name: Scan GPU worker image SBOM
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: gpu-worker.spdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: table
          grype-version: v0.110.0
          cache-db: false
          only-fixed: true
      - name: Scan semantic gateway image SBOM
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: semantic-gateway.spdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: table
          grype-version: v0.110.0
          cache-db: false
          only-fixed: true
      - name: Scan MEGA-enabled control-plane image SBOM
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: control-plane-mega.spdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: table
          grype-version: v0.110.0
          cache-db: false
          only-fixed: true
      - name: Scan Patreon browser sidecar image SBOM
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: patreon-browser.spdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: table
          grype-version: v0.110.0
          cache-db: false
          only-fixed: true
