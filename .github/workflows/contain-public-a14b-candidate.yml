name: Bootstrap private owner-scoped A14B package

on:
  push:
    branches:
      - emergency/a14b-ghcr-containment-v2

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-video-worker-a14b-private
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_BASE_SHA: 48f74ec9e6cd46f74804747ae37da80f2a4f08a3
      IMAGE_NAME: ghcr.io/neuraln-cyber/video-worker-a14b-private
      PACKAGE_API_NAME: video-worker-a14b-private
      REGISTRY_REPOSITORY: neuraln-cyber/video-worker-a14b-private
      BOOTSTRAP_TAG: private-bootstrap-48f74ec9e6cd46f74804747ae37da80f2a4f08a3
      BUILDKIT_IMAGE: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
    steps:
      - name: Check out the exact bootstrap commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the contained legacy package and an absent new package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = "neuraln-cyber/gen-automation" ]
          [ "$GITHUB_REF" = "refs/heads/emergency/a14b-ghcr-containment-v2" ]
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD
          [ "$(git diff --name-only "$EXPECTED_BASE_SHA" HEAD)" = ".github/workflows/contain-public-a14b-candidate.yml" ]

          old_status="$(
            curl --silent --show-error \
              --output "$RUNNER_TEMP/a14b-old-package.json" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              'https://api.github.com/users/neuraln-cyber/packages/container/gen-automation%2Fvideo-worker-a14b-private'
          )"
          [ "$old_status" = "404" ] || {
            printf 'The exposed legacy package is not authoritatively absent.\n' >&2
            exit 1
          }

          new_status="$(
            curl --silent --show-error \
              --output "$RUNNER_TEMP/a14b-new-package-preflight.json" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/users/neuraln-cyber/packages/container/${PACKAGE_API_NAME}"
          )"
          [ "$new_status" = "404" ] || {
            printf 'The owner-scoped bootstrap package already exists.\n' >&2
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          version: v0.36.1
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push a harmless scratch bootstrap
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_dir="$(mktemp -d)"
          printf 'private A14B package bootstrap; contains no model or application bytes\n' \
            >"$bootstrap_dir/marker.txt"
          cat >"$bootstrap_dir/Dockerfile" <<'EOF'
          FROM scratch
          COPY marker.txt /a14b-private-bootstrap.txt
          LABEL org.opencontainers.image.title="A14B private package bootstrap"
          LABEL org.opencontainers.image.description="Harmless marker only; no model or application bytes"
          EOF
          docker buildx build \
            --file "$bootstrap_dir/Dockerfile" \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --push \
            --tag "${IMAGE_NAME}:${BOOTSTRAP_TAG}" \
            "$bootstrap_dir"
          tag_manifest="$(
            docker buildx imagetools inspect \
              "${IMAGE_NAME}:${BOOTSTRAP_TAG}" \
              --format '{{json .Manifest}}'
          )"
          digest="$(
            MANIFEST_JSON="$tag_manifest" python3 -c \
              'import json, os; print(json.loads(os.environ["MANIFEST_JSON"])["digest"])'
          )"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"

      - name: Require private metadata and anonymous pull denial
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_DIGEST: ${{ steps.bootstrap.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          package_path="/users/neuraln-cyber/packages/container/${PACKAGE_API_NAME}"
          package_json="$RUNNER_TEMP/a14b-private-bootstrap-package.json"
          package_status="$(
            curl --silent --show-error \
              --output "$package_json" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com${package_path}"
          )"
          [ "$package_status" = "200" ]
          PACKAGE_JSON="$package_json" python3 - <<'PY'
          import json
          import os

          with open(os.environ["PACKAGE_JSON"], encoding="utf-8") as handle:
              package = json.load(handle)
          if package.get("name") != "video-worker-a14b-private":
              raise SystemExit("unexpected bootstrap package name")
          if package.get("package_type") != "container":
              raise SystemExit("unexpected bootstrap package type")
          if package.get("visibility") != "private":
              raise SystemExit("owner-scoped bootstrap package is not private")
          PY

          authenticated_manifest="$(
            docker buildx imagetools inspect \
              "${IMAGE_NAME}:${BOOTSTRAP_TAG}" \
              --format '{{json .Manifest}}'
          )"
          authenticated_digest="$(
            MANIFEST_JSON="$authenticated_manifest" python3 -c \
              'import json, os; print(json.loads(os.environ["MANIFEST_JSON"])["digest"])'
          )"
          [ "$authenticated_digest" = "$BOOTSTRAP_DIGEST" ]

          token_json="$RUNNER_TEMP/a14b-private-bootstrap-anonymous-token.json"
          token_status="$(
            curl --silent --show-error --get \
              --output "$token_json" \
              --write-out '%{http_code}' \
              --data-urlencode 'service=ghcr.io' \
              --data-urlencode "scope=repository:${REGISTRY_REPOSITORY}:pull" \
              'https://ghcr.io/token'
          )"
          if [ "$token_status" = "200" ]; then
            anonymous_token="$(jq -er '.token | select(type == "string" and length > 0)' "$token_json")"
            manifest_status="$(
              curl --silent --show-error \
                --output "$RUNNER_TEMP/a14b-private-bootstrap-anonymous-manifest.json" \
                --write-out '%{http_code}' \
                --header 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json' \
                --header "Authorization: Bearer ${anonymous_token}" \
                "https://ghcr.io/v2/${REGISTRY_REPOSITORY}/manifests/${BOOTSTRAP_DIGEST}"
            )"
            [[ "$manifest_status" =~ ^(401|403|404)$ ]]
          else
            [[ "$token_status" =~ ^(401|403)$ ]]
          fi
          printf 'Owner-scoped A14B package is private and denies anonymous pulls.\n'
