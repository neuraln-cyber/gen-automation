name: Publish private experimental A14B candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact green main commit to publish
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-video-worker-a14b-private
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/video-worker-a14b-private
      PACKAGE_NAME: gen-automation%2Fvideo-worker-a14b-private
      SOURCE_SHA: ${{ inputs.source_sha }}
      MODEL_MANIFEST_SHA256: f7d9aa4fc7783ca76b605d1dc520e3ef812257c40c4aef9803e635d28c37bbbb
      PROFILE_REGISTRY_SHA256: a0ddd172e300f72fc60c4ae87c4f7d1ff077a0ffa2a9725c7aae2d74ecffa7b9
      WORKFLOW_REGISTRY_SHA256: ceee10e914a13dc601a7f64d97237a2736e82c68aefb85c59a5cd9d34cb90d83
      MAX_COMPRESSED_IMAGE_BYTES: "33000000000"
      BUILDKIT_IMAGE: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      SBOM_GENERATOR_IMAGE: docker/buildkit-syft-scanner:stable-1@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68
    outputs:
      candidate_digest: ${{ steps.verify.outputs.digest }}
      compressed_bytes: ${{ steps.verify.outputs.compressed_bytes }}
    steps:
      - name: Check out exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact source and a private-or-absent package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$SOURCE_SHA" = "$GITHUB_SHA" ]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          ci_runs="$RUNNER_TEMP/a14b-ci-runs.json"
          gh api --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$SOURCE_SHA" \
            -f status=completed -f per_page=100 >"$ci_runs"
          CI_RUNS="$ci_runs" SOURCE_SHA="$SOURCE_SHA" python3 - <<'PY'
          import json, os
          with open(os.environ["CI_RUNS"], encoding="utf-8") as handle:
              runs = json.load(handle).get("workflow_runs", [])
          if not any(
              run.get("head_sha") == os.environ["SOURCE_SHA"]
              and run.get("event") == "push"
              and run.get("conclusion") == "success"
              for run in runs
          ):
              raise SystemExit("no successful main CI run exists for source")
          PY
          repository_json="$(gh api "/repos/${GITHUB_REPOSITORY}")"
          owner="${GITHUB_REPOSITORY%%/*}"
          owner_type="$(jq -r .owner.type <<<"$repository_json")"
          case "$owner_type" in
            Organization) package_scope="orgs" ;;
            User) package_scope="users" ;;
            *) exit 1 ;;
          esac
          package_body="$RUNNER_TEMP/a14b-package-preflight.json"
          package_url="https://api.github.com/${package_scope}/${owner}/packages/container/${PACKAGE_NAME}"
          http_status="$(
            curl --silent --show-error \
              --output "$package_body" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$package_url"
          )"
          # GHCR creates a package on its first push and defaults that new
          # package to private, including when the source repository is public.
          # The gate accepts that exact bootstrap 404 and fails closed otherwise.
          python3 scripts/require_private_ghcr_package.py \
            --phase pre-push \
            --http-status "$http_status" \
            --response-file "$package_body"
          manifest=video-models/wan2.2-smoothmix-i2v-a14b-q3-private.json
          [ "$(sha256sum "$manifest" | cut -d' ' -f1)" = "$MODEL_MANIFEST_SHA256" ]
          MANIFEST="$manifest" python3 - <<'PY'
          import json, os
          with open(os.environ["MANIFEST"], encoding="utf-8") as handle:
              manifest = json.load(handle)
          if manifest["distribution"]["runtime_fit_verified"] is not False:
              raise SystemExit("candidate workflow accepts only an unverified image")
          if manifest["predeploy_validation"]["runtime_fit_report_sha256"] is not None:
              raise SystemExit("candidate manifest unexpectedly contains a fit report")
          PY
          git diff --exit-code
      - name: Reclaim runner space and require a bounded build floor
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          available_bytes="$(df --output=avail -B1 / | tail -n 1 | tr -d ' ')"
          [[ "$available_bytes" =~ ^[0-9]+$ ]]
          [ "$available_bytes" -ge 70000000000 ] || {
            printf 'Insufficient free space for the private A14B candidate build.\n' >&2
            exit 1
          }
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          version: v0.36.1
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Log in only after all private publication gates pass
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an immutable candidate tag
        shell: bash
        run: |
          set -euo pipefail
          candidate="${IMAGE_NAME}:candidate-sha-${SOURCE_SHA}"
          error_file="$RUNNER_TEMP/a14b-candidate-inspect-error"
          if docker buildx imagetools inspect "$candidate" >/dev/null 2>"$error_file"; then
            printf 'The immutable candidate tag already exists.\n' >&2
            exit 1
          fi
          grep -Eqi 'not found|manifest unknown|does not exist' "$error_file" || {
            cat "$error_file" >&2
            exit 1
          }
      - name: Build and push the immutable unverified candidate
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.video-worker-a14b
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:candidate-sha-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: generator=${{ env.SBOM_GENERATOR_IMAGE }}
      - name: Require the model-bearing package to be private after push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repository_json="$(gh api "/repos/${GITHUB_REPOSITORY}")"
          owner="${GITHUB_REPOSITORY%%/*}"
          owner_type="$(jq -r .owner.type <<<"$repository_json")"
          case "$owner_type" in
            Organization) package_scope="orgs" ;;
            User) package_scope="users" ;;
            *) exit 1 ;;
          esac
          package_body="$RUNNER_TEMP/a14b-package-post-push.json"
          package_url="https://api.github.com/${package_scope}/${owner}/packages/container/${PACKAGE_NAME}"
          http_status="$(
            curl --silent --show-error \
              --output "$package_body" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$package_url"
          )"
          python3 scripts/require_private_ghcr_package.py \
            --phase post-push \
            --http-status "$http_status" \
            --response-file "$package_body"
      - name: Verify exact labels and compressed size
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:candidate-sha-${SOURCE_SHA}"
          digest="${{ steps.push.outputs.digest }}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          tag_manifest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}')"
          tag_digest="$(
            MANIFEST_JSON="$tag_manifest" python3 -c \
              'import json, os; print(json.loads(os.environ["MANIFEST_JSON"])["digest"])'
          )"
          [ "$tag_digest" = "$digest" ]
          image_json="$(
            docker buildx imagetools inspect "${IMAGE_NAME}@${digest}" --format '{{json .Image}}'
          )"
          IMAGE_JSON="$image_json" python3 - <<'PY'
          import json, os
          image = json.loads(os.environ["IMAGE_JSON"])
          labels = image["config"]["Labels"]
          expected = {
              "org.opencontainers.image.visibility-required": "private",
              "org.opencontainers.image.runtime-fit-verified": "false",
              "org.opencontainers.image.model.manifest-sha256": os.environ["MODEL_MANIFEST_SHA256"],
              "org.opencontainers.image.video-profile-registry-sha256": os.environ["PROFILE_REGISTRY_SHA256"],
              "org.opencontainers.image.video-workflow-registry-sha256": os.environ["WORKFLOW_REGISTRY_SHA256"],
          }
          for key, value in expected.items():
              if labels.get(key) != value:
                  raise SystemExit(f"label mismatch: {key}")
          PY
          raw_index="$(docker buildx imagetools inspect "${IMAGE_NAME}@${digest}" --raw)"
          platform_digest="$(
            RAW_INDEX="$raw_index" IMAGE_DIGEST="$digest" python3 -c '
          import json, os
          data = json.loads(os.environ["RAW_INDEX"])
          if "layers" in data:
              print(os.environ["IMAGE_DIGEST"])
          else:
              matches = [
                  item["digest"] for item in data.get("manifests", [])
                  if item.get("platform", {}).get("os") == "linux"
                  and item.get("platform", {}).get("architecture") == "amd64"
                  and item.get("annotations", {}).get("vnd.docker.reference.type")
                      != "attestation-manifest"
              ]
              if len(matches) != 1:
                  raise SystemExit("expected one linux/amd64 image manifest")
              print(matches[0])
          '
          )"
          [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          raw_manifest="$(
            docker buildx imagetools inspect "${IMAGE_NAME}@${platform_digest}" --raw
          )"
          compressed_bytes="$(
            RAW_MANIFEST="$raw_manifest" python3 -c '
          import json, os
          layers = json.loads(os.environ["RAW_MANIFEST"]).get("layers")
          assert isinstance(layers, list) and layers
          print(sum(int(layer["size"]) for layer in layers))
          '
          )"
          [[ "$compressed_bytes" =~ ^[0-9]+$ ]]
          [ "$compressed_bytes" -le "$MAX_COMPRESSED_IMAGE_BYTES" ] || {
            printf 'Compressed image exceeds the deployment cap.\n' >&2
            exit 1
          }
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"
          printf 'compressed_bytes=%s\n' "$compressed_bytes" >>"$GITHUB_OUTPUT"
          printf '{"compressed_bytes":%s,"digest":"%s","source_sha":"%s"}\n' \
            "$compressed_bytes" "$digest" "$SOURCE_SHA" \
            >"$RUNNER_TEMP/a14b-candidate.json"
      - name: Extract and validate the exact candidate SBOM
        shell: bash
        run: |
          set -euo pipefail
          sbom_tree="$RUNNER_TEMP/a14b-candidate-sbom-tree.json"
          sbom_file="$RUNNER_TEMP/a14b-candidate.spdx.json"
          docker buildx imagetools inspect \
            "${IMAGE_NAME}@${{ steps.verify.outputs.digest }}" \
            --format '{{json .SBOM}}' >"$sbom_tree"
          SBOM_TREE="$sbom_tree" SBOM_FILE="$sbom_file" python3 - <<'PY'
          import json
          import os

          with open(os.environ["SBOM_TREE"], encoding="utf-8") as handle:
              tree = json.load(handle)
          if isinstance(tree, dict) and "SPDX" in tree:
              spdx = tree["SPDX"]
          else:
              platform = tree.get("linux/amd64") if isinstance(tree, dict) else None
              spdx = platform.get("SPDX") if isinstance(platform, dict) else None
          if not isinstance(spdx, dict) or spdx.get("spdxVersion") != "SPDX-2.3":
              raise SystemExit("exact A14B candidate has no linux/amd64 SPDX 2.3 SBOM")
          if not isinstance(spdx.get("packages"), list) or not spdx["packages"]:
              raise SystemExit("exact A14B candidate SBOM has no packages")
          with open(os.environ["SBOM_FILE"], "w", encoding="utf-8") as handle:
              json.dump(spdx, handle, sort_keys=True, separators=(",", ":"))
              handle.write("\n")
          PY
      - name: Scan the exact private A14B candidate SBOM
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: ${{ runner.temp }}/a14b-candidate.spdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: table
          grype-version: v0.110.0
          cache-db: false
      - name: Upload the exact candidate handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a14b-candidate-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/a14b-candidate.json
            ${{ runner.temp }}/a14b-candidate.spdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Attest the private registry digest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
