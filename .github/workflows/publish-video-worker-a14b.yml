name: Disabled public A14B publisher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse model publication from the public repository
        shell: bash
        run: |
          printf '%s\n' \
            'A14B model publication is restricted to the private packaging repository.' >&2
          exit 1
