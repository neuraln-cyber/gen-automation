{% extends "dashboard/base.html" %}
{% block content %}
  <a class="back" href="/dashboard">&larr; All sets</a>
  <section
    class="panel panel-accent review-bootstrap"
    aria-labelledby="review-bootstrap-heading"
    aria-live="polite"
  >
    <span class="workflow-label">Opening set</span>
    <h1 id="review-bootstrap-heading">Preparing your review workspace</h1>
    <p class="lede">
      Every ranked master starts in the final set. Remove only the images you do not want;
      anatomy labels stay optional.
    </p>
    <div class="review-bootstrap-progress" role="status">
      <span class="review-bootstrap-spinner" aria-hidden="true"></span>
      <span>Loading the unified image library&hellip;</span>
    </div>
    <form
      method="post"
      action="/dashboard/releases/{{ release_id }}/review-tasks"
      data-review-bootstrap
    >
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input
        type="hidden"
        name="idempotency_key"
        value="{{ create_idempotency_key }}"
      >
      <button class="secondary-button" type="submit">
        Continue if the workspace does not open
      </button>
    </form>
  </section>
{% endblock %}
