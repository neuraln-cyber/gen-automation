<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} · Generation control</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111217;
        --surface: #1b1d25;
        --surface-strong: #242733;
        --text: #f5f6fa;
        --muted: #aeb4c5;
        --accent: #9d8cff;
        --border: #363a49;
        --good: #75d8ab;
        --warn: #ffcf70;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }
      a { color: var(--accent); }
      a:focus-visible, button:focus-visible, input:focus-visible,
      select:focus-visible, textarea:focus-visible {
        outline: 3px solid var(--warn);
        outline-offset: 3px;
      }
      header {
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .header-inner, main {
        width: min(1180px, calc(100% - 2rem));
        margin-inline: auto;
      }
      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        min-height: 4rem;
      }
      .brand { color: var(--text); font-weight: 750; text-decoration: none; }
      .operator { color: var(--muted); font-size: .9rem; text-align: right; }
      main { padding-block: 2rem 4rem; }
      h1 { margin: 0 0 .4rem; font-size: clamp(1.8rem, 4vw, 2.7rem); line-height: 1.15; }
      h2 { margin: 0; font-size: 1.15rem; }
      .lede, .muted { color: var(--muted); }
      .back { display: inline-block; margin-bottom: 1.25rem; }
      .panel {
        padding: 1.25rem;
        border: 1px solid var(--border);
        border-radius: .85rem;
        background: var(--surface);
      }
      .review-entry { margin-top: 1.5rem; }
      .review-entry p { max-width: 70ch; }
      .release-list, .asset-grid {
        display: grid;
        gap: 1rem;
        margin-top: 1.5rem;
        padding: 0;
        list-style: none;
      }
      .release-list { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
      .asset-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr)); }
      .release-card, .asset-card {
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: .85rem;
        background: var(--surface);
      }
      .release-card { padding: 1.15rem; }
      .release-card a { display: inline-block; margin-top: .7rem; font-weight: 700; }
      .status {
        display: inline-block;
        margin-top: .7rem;
        padding: .2rem .55rem;
        border-radius: 999px;
        background: var(--surface-strong);
        color: var(--muted);
        font-size: .82rem;
      }
      .status.ready { color: var(--good); }
      .asset-preview {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: contain;
        background: #08090c;
      }
      .asset-body { padding: 1rem; }
      .rank-line {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: .8rem;
      }
      .rank { font-size: 1.45rem; font-weight: 800; }
      .score { color: var(--good); font-weight: 750; }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: .25rem .75rem;
        margin: .85rem 0;
        font-size: .9rem;
      }
      dt { color: var(--muted); }
      dd { margin: 0; overflow-wrap: anywhere; }
      .notes { margin: .75rem 0; padding-left: 1.2rem; color: var(--muted); }
      .download {
        display: block;
        padding: .65rem .8rem;
        border-radius: .55rem;
        background: var(--accent);
        color: #0e0d14;
        text-align: center;
        text-decoration: none;
        font-weight: 800;
      }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .5; }
      .primary-button, .secondary-button, .primary-action, .decision-button {
        display: inline-block;
        min-height: 2.75rem;
        padding: .65rem .9rem;
        border: 1px solid transparent;
        border-radius: .55rem;
        font-weight: 800;
      }
      .primary-button, .primary-action {
        background: var(--accent);
        color: #0e0d14;
        text-decoration: none;
      }
      .secondary-button {
        border-color: var(--border);
        background: var(--surface-strong);
        color: var(--text);
      }
      .danger { color: #ffb4b4; }
      .review-summary { display: grid; gap: 1rem; margin-top: 1.25rem; }
      .count-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: .75rem;
        margin: 0;
      }
      .count-grid div {
        padding: .75rem;
        border-radius: .55rem;
        background: var(--surface-strong);
      }
      .count-grid dt { font-size: .8rem; }
      .count-grid dd { font-size: 1.4rem; font-weight: 800; }
      .task-actions, .decision-actions {
        display: flex;
        flex-wrap: wrap;
        gap: .65rem;
      }
      .terminal-state, .current-decision {
        padding: .6rem .75rem;
        border-radius: .5rem;
        background: var(--surface-strong);
      }
      .decision-detail { color: var(--muted); overflow-wrap: anywhere; }
      .semantic-status {
        margin: .8rem 0;
        padding: .7rem .8rem;
        border: 1px solid var(--border);
        border-radius: .5rem;
        background: var(--surface-strong);
      }
      .semantic-status.severe {
        border-color: #a75c68;
        background: #3b2025;
      }
      .semantic-status p { margin: 0; }
      .semantic-issues { margin: .45rem 0 0; padding-left: 1.2rem; color: var(--muted); }
      .ai-excluded-heading {
        grid-column: 1 / -1;
        padding: 1rem 1.1rem;
        border: 1px solid #a75c68;
        border-radius: .75rem;
        background: #3b2025;
      }
      .ai-excluded-heading h2 { margin-bottom: .25rem; }
      .asset-card.ai-excluded { border-color: #a75c68; }
      .decision-form { display: grid; gap: .45rem; margin: 1rem 0; }
      .decision-form label, legend { color: var(--muted); font-size: .88rem; }
      .decision-form input, .decision-form textarea {
        width: 100%;
        padding: .6rem;
        border: 1px solid var(--border);
        border-radius: .45rem;
        background: #111217;
        color: var(--text);
      }
      .decision-form textarea { resize: vertical; }
      .decision-form fieldset { margin: .45rem 0 0; padding: 0; border: 0; }
      .set-form { display: grid; gap: 1rem; margin-top: 1.5rem; }
      .set-form fieldset {
        display: grid;
        gap: .85rem;
        margin: 0;
        padding: 1rem;
        border: 1px solid var(--border);
        border-radius: .65rem;
      }
      .set-form legend { padding-inline: .35rem; font-weight: 800; color: var(--text); }
      .set-form label { display: grid; gap: .35rem; color: var(--muted); font-size: .9rem; }
      .set-form input, .set-form select, .set-form textarea {
        width: 100%;
        padding: .65rem;
        border: 1px solid var(--border);
        border-radius: .45rem;
        background: #111217;
        color: var(--text);
      }
      .set-form textarea { resize: vertical; }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr));
        gap: .85rem;
      }
      .lora-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(7rem, .28fr);
        gap: .75rem;
      }
      .form-error {
        padding: .8rem 1rem;
        border: 1px solid #934f58;
        border-radius: .55rem;
        background: #3b2025;
        color: #ffd9dd;
      }
      .token-list { display: flex; flex-wrap: wrap; gap: .45rem; }
      .token-list code, .digest {
        overflow-wrap: anywhere;
        padding: .15rem .35rem;
        border-radius: .3rem;
        background: var(--surface-strong);
      }
      .status-list { display: flex; flex-wrap: wrap; gap: .6rem; padding: 0; list-style: none; }
      .decision-button { flex: 1 1 5rem; color: #0e0d14; }
      .decision-button.accept { background: var(--good); }
      .decision-button.reject { background: #ff9898; }
      .decision-button.hold { background: var(--warn); }
      .error { max-width: 720px; margin-top: 2rem; }
      @media (max-width: 520px) {
        .header-inner { align-items: flex-start; flex-direction: column; padding-block: .8rem; }
        .operator { text-align: left; }
        .count-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div>
          <a class="brand" href="/dashboard">Generation control</a>
          &nbsp;&middot;&nbsp;
          <a href="/dashboard/new-set">New Set</a>
          &nbsp;&middot;&nbsp;
          <a href="/dashboard/wildcards">Prompt wildcards</a>
        </div>
        <div class="operator">
          Signed in as {{ principal.display_name }}<br>
          {{ principal.role.value }}
        </div>
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
