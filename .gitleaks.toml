title = "gen-automation secret scanning policy"

[extend]
useDefault = true

# These deterministic test fixtures are not credentials. Keep every exception
# constrained to the generic rule, exact test files, and exact complete lines so
# that any other finding in those files continues to fail the scan.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Known non-secret idempotency and corrupt-ciphertext fixtures"
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)tests/test_admin_bootstrap\.py$''',
  '''(^|/)tests/test_compliance_api\.py$''',
  '''(^|/)tests/test_compliance_registry\.py$''',
  '''(^|/)tests/test_salad_service\.py$''',
]
regexes = [
  '''^\s*idempotency_key="scheduler-claim-1",\s*$''',
  '''^\s*idempotency_key="scheduler-claim-2",\s*$''',
  '''^\s*idempotency_key="subject-reaffirm-v1",\s*$''',
  '''^\s*idempotency_key="subject-revoke-v2",\s*$''',
  '''^\s*"Idempotency-Key": "approve-subject-v1",\s*$''',
  '''^\s*"Idempotency-Key": "revoke-subject-v1",\s*$''',
  '''^\s*user\.totp_secret_ciphertext = "v1\.key-1\.corrupt"\s+# noqa: S105\s*$''',
]

[[rules.allowlists]]
description = "Known non-secret X teaser idempotency fixtures in commit 6c7f4ef"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)tests/test_x_teaser_revisions\.py$''']
regexes = [
  '''^\s*key="x-idempotency-k[12]",\s*$''',
  '''^\s*IdempotencyRecord\.idempotency_key == "x-idempotency-k2",\s*$''',
]

[[rules.allowlists]]
description = "Exact non-secret patch checksum labels in historical commit fb9ab99"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)Dockerfile\.worker$''']
regexes = [
  '''^\s*SALAD_QUEUE_WORKER_TOKEN_PATCH_SHA256=916f22c8075481a2924aabc2f1d1b57d891681eb5bd10b6081487df7b57a336d\s*$''',
  '''^\s*org\.opencontainers\.image\.salad-queue-worker\.token-patch-sha256="916f22c8075481a2924aabc2f1d1b57d891681eb5bd10b6081487df7b57a336d"\s*$''',
]
