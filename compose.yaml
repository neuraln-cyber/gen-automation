services:
  postgres:
    image: postgres:16.14-alpine3.24
    environment:
      POSTGRES_DB: gen_automation
      POSTGRES_USER: gen_automation
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gen_automation -d gen_automation"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  control-plane:
    build: .
    environment:
      GEN_AUTOMATION_ENVIRONMENT: local
      GEN_AUTOMATION_DATABASE_URL: postgresql+psycopg://gen_automation:local-development-only@postgres:5432/gen_automation
      GEN_AUTOMATION_PUBLIC_BASE_URL: http://127.0.0.1:8000
      GEN_AUTOMATION_SESSION_SECRET: local-compose-session-secret-not-for-production
      GEN_AUTOMATION_AUTO_CREATE_SCHEMA: "false"
      GEN_AUTOMATION_AUTH_DEVELOPMENT_BYPASS_ENABLED: "true"
      GEN_AUTOMATION_GPU_ALLOCATION_ENABLED: "false"
      GEN_AUTOMATION_PUBLISHING_ENABLED: "false"
    command:
      - /bin/sh
      - -c
      - >-
        alembic upgrade head &&
        uvicorn gen_automation.app:app
        --host 0.0.0.0
        --port 8000
        --no-proxy-headers
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres-data:
